<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapral Papkłiz - Zrób 10 quiz-pompek</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="translations.js"></script>
    <script src="parser.js"></script>
    <script src="mp.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body x-data="quizApp()" x-init="initApp()">

    <div class="container">

        <!-- HEADER / NAVIGATION -->
        <div class="header-nav">
            <div style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer;" @click="showDashboard()">
                <img src="logo.png" alt="Kapral Papkłiz" style="height: 6rem; width: auto; border-radius: var(--pico-border-radius);">
                <div>
                    <h2 style="margin: 0; font-size: 1.25rem; line-height: 1;">Kapral <span style="color: var(--pico-primary);">Papkłiz</span></h2>
                    <small style="color: var(--pico-muted-color);" x-text="t('subtitle')"></small>
                </div>
            </div>
            <nav style="margin: 0;">
                <ul>
                    <li>
                        <button class="outline secondary btn-sm" @click="toggleTheme()" :title="isDark ? t('themeToggleDark') : t('themeToggleLight')">
                            <i class="fa-solid" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
                        </button>
                    </li>
                    <li>
                        <details class="dropdown">
                            <summary class="outline secondary btn-sm" role="button">
                                <i class="fa-solid fa-palette"></i>
                            </summary>
                            <ul>
                                <li><a href="#" @click.prevent="$el.closest('details').open = false; setPalette('pink')"><span class="palette-dot" style="background:#f06292;"></span><span x-text="t('palettePink')"></span></a></li>
                                <li><a href="#" @click.prevent="$el.closest('details').open = false; setPalette('cyan')"><span class="palette-dot" style="background:#4dd0e1;"></span><span x-text="t('paletteCyan')"></span></a></li>
                                <li><a href="#" @click.prevent="$el.closest('details').open = false; setPalette('sand')"><span class="palette-dot" style="background:#a1887f;"></span><span x-text="t('paletteSand')"></span></a></li>
                                <li><a href="#" @click.prevent="$el.closest('details').open = false; setPalette('slate')"><span class="palette-dot" style="background:#78909c;"></span><span x-text="t('paletteSlate')"></span></a></li>
                            </ul>
                        </details>
                    </li>
                    <li>
                        <button class="outline secondary btn-sm" @click="toggleLang()" :title="currentLang === 'pl' ? 'Switch to English' : 'Przełącz na polski'">
                            <span x-text="currentLang === 'pl' ? '🇬🇧' : '🇵🇱'"></span>
                        </button>
                    </li>
                    <li>
                        <button x-show="!editingUsername" class="outline secondary btn-sm"
                                @click="editingUsername = true; usernameInputValue = username; $nextTick(() => $refs.usernameInput.focus())">
                            <i class="fa-solid fa-user"></i>
                            <span x-text="username || t('guest')"></span>
                        </button>
                        <div x-show="editingUsername" style="display: flex; gap: 0.25rem; align-items: center;">
                            <input x-ref="usernameInput" x-model="usernameInputValue"
                                   @keydown.enter="saveUsername()" @keydown.escape="cancelEditUsername()"
                                   :placeholder="t('usernamePlaceholder')" maxlength="20" style="margin: 0; width: 140px;">
                            <button class="btn-xs" @click="saveUsername()" :title="t('save')"><i class="fa-solid fa-check"></i></button>
                            <button class="outline secondary btn-xs" @click="cancelEditUsername()" :title="t('cancel')"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </li>
                    <li>
                        <button class="outline btn-sm" @click="view = 'multiplayer'">
                            <i class="fa-solid fa-users"></i>
                            <span class="hide-on-mobile" x-text="t('multiplayer')"></span>
                        </button>
                    </li>
                    <li>
                        <button class="outline secondary btn-sm" @click="view = 'help'" :title="t('helpTitle')">
                            <i class="fa-solid fa-circle-question"></i>
                        </button>
                    </li>
                    <li>
                        <button class="outline btn-sm" @click="view = 'history'">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span x-text="getAnsweredCount()"></span>
                        </button>
                    </li>
                </ul>
            </nav>
            <small class="version">
                <a href="https://github.com/j4kub5/kapral" target="_blank" rel="noopener" class="github-link" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <span x-text="'v' + APP_VERSION"></span>
            </small>
        </div>

        <!-- START PANEL -->
        <div class="start-panel" x-show="view === 'dashboard' && packs.length > 0" x-transition>
            <div class="container">
                <div class="start-panel-inner">
                    <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <div>
                            <strong x-text="selectedPacks().length"></strong> <span x-text="t('packsLabel')"></span>
                            <strong x-text="totalSelectedQuestions()"></strong> <span x-text="t('questionsLabel')"></span>
                        </div>
                        <button class="outline secondary btn-xs" @click="selectAllPacks()">
                            <i class="fa-solid fa-check-double"></i> <span x-text="packs.every(p => p.selected) ? t('deselectAll') : t('selectAll')"></span>
                        </button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                        <label style="margin: 0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap;">
                            <small style="color: var(--pico-muted-color);" x-text="t('questionsCount')"></small>
                            <select x-model.number="questionCount" style="width: auto; margin: 0;">
                                <option :value="3">3</option>
                                <option :value="5">5</option>
                                <option :value="10">10</option>
                                <option :value="20">20</option>
                                <option :value="50">50</option>
                                <option :value="0">∞</option>
                            </select>
                        </label>
                        <label>
                            <input type="checkbox" x-model="filterOutAnswered" role="switch">
                            <i class="fa-solid fa-eye-slash" :title="t('skipAnswered')"></i>
                        </label>
                        <div class="timer-group">
                            <label style="margin: 0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap;">
                                <i class="fa-solid fa-stopwatch" :title="t('timerOn')"></i>
                                <small style="color: var(--pico-muted-color);" x-text="t('timePerQuestion')"></small>
                                <select x-model.number="timerDuration" @change="setTimerDuration($event.target.value)" style="width: auto; margin: 0;">
                                    <option :value="0">∞</option>
                                    <option :value="10">10s</option>
                                    <option :value="15">15s</option>
                                    <option :value="20">20s</option>
                                    <option :value="30">30s</option>
                                </select>
                            </label>
                        </div>
                        <button class="btn-auto" style="padding: 0.5rem 1.5rem;" :disabled="selectedPacks().length === 0" @click="startQuizFromPacks()">
                            <i class="fa-solid fa-play"></i> <span x-text="t('start')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 1: DASHBOARD -->
        <main x-show="view === 'dashboard'" x-transition>
            <section class="dashboard-intro" style="text-align: center; margin-bottom: 1.5rem;">
                <h3 style="cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;" @click="showRankList = !showRankList">
                    <span x-text="dashboardGreeting"></span>
                    <i class="fa-solid fa-chevron-down" :class="showRankList ? 'rotate-180' : ''" style="font-size: 0.75rem; transition: transform 0.2s;"></i>
                </h3>
                <div x-show="showRankList" x-transition class="rank-list">
                    <template x-for="(rank, i) in ranks" :key="rank.name">
                        <div class="rank-item" :class="i === activeRankIndex ? 'active' : ''">
                            <span class="rank-position" x-text="'#' + (i + 1)"></span>
                            <span x-text="rank.name"></span>
                            <small x-text="rank.min + '%'"></small>
                        </div>
                    </template>
                </div>
                    <p style="color: var(--pico-muted-color); max-width: 600px; margin: 0 auto;" x-text="t('dashboardHint')"></p>
            </section>

            <!-- Search & Filter -->
            <article>
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 200px;">
                        <input type="search" x-model="packSearch" :placeholder="t('searchPlaceholder')" style="margin: 0; flex: 1;">
                    </div>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button class="outline secondary btn-sm" @click="loadBuiltinPacks()">
                            <i class="fa-solid fa-rotate"></i> <span class="hide-on-mobile" x-text="t('reload')"></span>
                        </button>
                    </div>
                </div>
            </article>

            <!-- Loading indicator -->
            <template x-if="loading">
                <article aria-busy="true" x-text="t('loading')"></article>
            </template>

            <!-- User Packs -->
            <div>
                <h4 style="margin-bottom: 0.75rem;"><i class="fa-solid fa-user"></i> <span x-text="t('myPacks')"></span></h4>
                <div class="grid-batches">
                    <template x-for="pack in allPacksFiltered.filter(p => p.source === 'user')" :key="'u-' + pack.name">
                        <article class="pack-card" :class="pack.selected ? 'selected' : ''" style="padding: 1.25rem; margin: 0; position: relative;" @click="togglePack(pack)">
                            <i class="fa-solid fa-circle-check pack-check"></i>
                            <button class="pack-download-btn" @click.stop="exportPackAsMarkdown(pack)" :title="t('downloadPack')">
                                <i class="fa-solid fa-download"></i>
                            </button>
                            <button class="pack-remove-btn" @click.stop="removeUserPack(pack)" :title="t('removePack')">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                                <span class="pack-badge user" x-text="t('userBadge')"></span>
                                <small>
                                    <span x-text="packProgress(pack).answered + '/' + packProgress(pack).total"></span>
                                    <template x-if="packProgress(pack).answered > 0">
                                        <span> · <span class="pack-progress-new" x-text="packProgress(pack).newQ + ' ' + t('newCount')"></span></span>
                                    </template>
                                </small>
                            </div>
                            <h4 style="margin-bottom: 0.5rem; font-size: 1.1rem;" x-text="pack.name"></h4>
                            <p style="color: var(--pico-muted-color); font-size: 0.85rem; margin: 0;" x-text="[...new Set(pack.questions.map(q => q.category))].join(', ')"></p>
                        </article>
                    </template>

                    <!-- Upload card -->
                    <article style="padding: 1.25rem; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 120px; border-style: dashed; cursor: pointer;">
                        <label style="margin: 0; cursor: pointer; text-align: center; color: var(--pico-muted-color);">
                            <i class="fa-solid fa-plus" style="font-size: 1.5rem; display: block; margin-bottom: 0.5rem;"></i>
                            <span x-text="t('uploadLabel')"></span>
                            <input type="file" @change="handleFileUpload($event)" accept=".md" style="display: none;">
                        </label>
                    </article>

                    <!-- Paste markdown card -->
                    <article style="padding: 1.25rem; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 120px; border-style: dashed; cursor: pointer;" @click="pasteMarkdown()">
                        <div style="text-align: center; color: var(--pico-muted-color);">
                            <i class="fa-solid fa-clipboard" style="font-size: 1.5rem; display: block; margin-bottom: 0.5rem;"></i>
                            <span x-text="t('pasteMarkdown')"></span>
                        </div>
                    </article>
                </div>
            </div>

            <!-- Built-in Packs -->
            <template x-if="!loading && allPacksFiltered.some(p => p.source === 'builtin')">
                <div style="margin-top: 1.5rem;">
                    <h4 style="margin-bottom: 0.75rem;"><i class="fa-solid fa-cube"></i> <span x-text="t('builtin')"></span></h4>
                    <div class="grid-batches">
                        <template x-for="pack in allPacksFiltered.filter(p => p.source === 'builtin')" :key="'b-' + pack.name">
                            <article class="pack-card" :class="pack.selected ? 'selected' : ''" style="padding: 1.25rem; margin: 0;" @click="togglePack(pack)">
                                <i class="fa-solid fa-circle-check pack-check"></i>
                                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                                    <span class="pack-badge builtin" x-text="t('builtinBadge')"></span>
                                    <small>
                                        <span x-text="packProgress(pack).answered + '/' + packProgress(pack).total"></span>
                                        <template x-if="packProgress(pack).answered > 0">
                                            <span> · <span class="pack-progress-new" x-text="packProgress(pack).newQ + ' ' + t('newCount')"></span></span>
                                        </template>
                                    </small>
                                </div>
                                <h4 style="margin-bottom: 0.5rem; font-size: 1.1rem;" x-text="pack.name"></h4>
                                <p style="color: var(--pico-muted-color); font-size: 0.85rem; margin: 0;" x-text="[...new Set(pack.questions.map(q => q.category))].join(', ')"></p>
                            </article>
                        </template>
                    </div>
                </div>
            </template>
        </main>

        <!-- VIEW 2: QUIZ GAMEPLAY -->
        <main x-show="view === 'quiz'" x-transition
              x-init="$watch('view', v => { if (v === 'quiz') $nextTick().then(() => MathJax.typesetPromise?.()) })">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                <span class="category-badge" x-text="currentQuestion?.category || 'Ogólne'"></span>
                <small x-text="t('questionOf', { n: currentPointer + 1, total: activeQuestions.length })"></small>
            </div>

            <progress :value="currentPointer + 1" :max="activeQuestions.length"></progress>

            <div x-show="timerEnabled" class="timer-bar">
                <div class="timer-fill" :class="timeLeft <= 5 ? 'timer-critical' : timeLeft <= 10 ? 'timer-warning' : ''" :style="`width: ${(timeLeft / timerDuration) * 100}%`"></div>
            </div>
            <div x-show="timerEnabled" style="text-align: right; margin-top: 0.25rem;">
                <small :style="timeLeft <= 5 ? 'color: #ef4444; font-weight: bold;' : 'color: var(--pico-muted-color);'" x-text="timeLeft + t('seconds')"></small>
            </div>

            <article style="padding: 1.5rem;" x-effect="currentPointer; $nextTick().then(() => MathJax.typesetPromise?.())">
                <h3 style="margin-bottom: 1rem; font-size: 1.35rem;" x-html="currentQuestion?.question"></h3>

                <template x-if="currentQuestion?.imageUrl">
                    <div class="img-container">
                        <img :src="currentQuestion.imageUrl"
                             :alt="currentQuestion.question"
                             @error="handleImageError($event)">
                    </div>
                </template>

                <div style="margin-top: 1.25rem;">
                    <template x-for="(opt, oIdx) in currentQuestion?.options" :key="oIdx">
                        <button class="option-button"
                                :class="getOptionState(oIdx).cls"
                                @click="selectOption(oIdx)"
                                :disabled="answeredCurrent">
                            <div>
                                <strong style="margin-right: 0.5rem;" x-text="['A)', 'B)', 'C)', 'D)', 'E)'][oIdx]"></strong>
                                <span x-html="opt"></span>
                            </div>
                            <i class="fa-solid" :class="getOptionState(oIdx).icon"></i>
                        </button>
                    </template>
                </div>

                <div x-show="answeredCurrent"
                     class="answer-feedback"
                     :class="answers[currentPointer]?.correct ? 'correct' : 'wrong'"
                     x-transition>
                    <i class="fa-solid" :class="answers[currentPointer]?.correct ? 'fa-circle-check' : 'fa-circle-xmark'"></i>
                    <strong x-text="answers[currentPointer]?.correct ? t('answerCorrect') : t('answerWrong')"></strong>
                </div>

                <div x-show="answeredCurrent && currentQuestion?.explanation"
                     x-transition
                     style="margin-top: 1.25rem; padding: 1rem; border-radius: var(--pico-border-radius); background-color: rgba(0, 0, 0, 0.1); border-left: 4px solid var(--pico-primary);">
                    <div style="font-weight: bold; color: var(--pico-primary); margin-bottom: 0.25rem;">
                        <i class="fa-solid fa-lightbulb"></i> <span x-text="t('explanation') + ':'"></span>
                    </div>
                    <div style="font-size: 0.95rem; color: var(--pico-color);" x-html="currentQuestion?.explanation"></div>
                </div>
            </article>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button class="outline secondary btn-auto" @click="showDashboard()">
                        <i class="fa-solid fa-arrow-left"></i> <span x-text="t('cancel')"></span>
                    </button>
                    <button class="outline secondary btn-auto" x-show="currentPointer > 0" @click="previousQuestion()">
                        <i class="fa-solid fa-chevron-left"></i> <span x-text="t('prev')"></span>
                    </button>
                </div>
                <button class="btn-auto" :disabled="!answeredCurrent" @click="nextQuestion()">
                    <span x-text="t('next')"></span> <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </main>

        <!-- VIEW 3: RESULTS SUMMARY -->
        <main x-show="view === 'results'" x-transition style="text-align: center; max-width: 600px; margin: 0 auto;">
            <article style="padding: 2rem;">
                <div style="font-size: 3rem; color: var(--pico-primary); margin-bottom: 1rem;">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 x-text="t('seriesFinished')"></h2>
                <p style="color: var(--pico-muted-color);" x-text="t('resultText')"></p>

                <div style="font-size: 3.5rem; font-weight: 800; color: var(--pico-primary); margin: 1rem 0 0.5rem 0;" x-text="batchScore + ' / ' + activeQuestions.length"></div>
                <p style="font-weight: 600;" x-text="Math.round((batchScore / activeQuestions.length) * 100) + '% ' + t('correctAnswers')"></p>
                <div x-show="timerEnabled" style="display: flex; gap: 1.5rem; justify-content: center; margin-top: 1rem; color: var(--pico-muted-color); font-size: 0.9rem;">
                    <span x-text="t('timedOutCount') + ': ' + timeoutCount"></span>
                    <span x-text="t('avgTime') + ': ' + avgTime + t('seconds')"></span>
                </div>
                <div style="margin-top: 1.5rem; padding: 1.5rem; border-radius: var(--pico-border-radius); background-color: var(--pico-primary); color: var(--pico-primary-inverse);">
                    <div style="font-size: 1rem; opacity: 0.8; margin-bottom: 0.25rem;" x-text="t('yourRank')"></div>
                    <div style="font-size: 2rem; font-weight: 800;">
                        <i class="fa-solid fa-medal"></i> <span x-text="rankName"></span>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                    <button class="outline secondary" @click="showDashboard()" x-text="t('backToMenu')"></button>
                    <button @click="startQuizFromPacks()" x-text="t('tryAgain')"></button>
                </div>
            </article>
        </main>

        <!-- VIEW 3.5: MULTIPLAYER -->
        <main x-show="view === 'multiplayer'" x-transition>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3><i class="fa-solid fa-users"></i> <span x-text="t('multiplayer')"></span></h3>
                <button class="outline secondary btn-auto" @click="leaveMultiplayer()">
                    <i class="fa-solid fa-xmark"></i> <span x-text="t('close')"></span>
                </button>
            </div>

            <!-- Connection -->
            <article x-show="mpScreen === 'connect'" x-transition>
                <h4 x-text="t('mpConnectTitle')"></h4>
                <p style="color: var(--pico-muted-color);" x-text="t('mpConnectHint')"></p>
                <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                    <input x-model="mpServer" :placeholder="t('mpServerPlaceholder')" style="margin: 0; flex: 1; min-width: 220px;" @keydown.enter="connectServer()">
                    <button class="btn-auto" @click="connectServer()">
                        <i class="fa-solid fa-plug"></i> <span x-text="t('mpConnect')"></span>
                    </button>
                </div>
            </article>

            <!-- Menu (create / join) -->
            <div x-show="mpScreen === 'menu'" x-transition>
                <article>
                    <h4 x-text="t('mpMenuTitle')"></h4>
                    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem;">
                        <input x-model="mpRoomName" :placeholder="t('mpRoomName')" maxlength="30" style="margin: 0; flex: 1; min-width: 180px;">
                        <button class="outline btn-sm" @click="mpRoomName = mpRandomRoomName()" :title="t('mpShuffleRoomName')" :aria-label="t('mpShuffleRoomName')">
                            <i class="fa-solid fa-dice"></i>
                        </button>
                    </div>
                    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                        <input x-model="mpNickname" :placeholder="t('mpNickname')" maxlength="20" style="margin: 0; flex: 1; min-width: 180px;" @input="mpPersistNickname()">
                        <button class="outline btn-sm" @click="mpNickname = mpRandomNickname()" :title="t('mpShuffleNickname')" :aria-label="t('mpShuffleNickname')">
                            <i class="fa-solid fa-dice"></i>
                        </button>
                        <button class="outline" @click="createRoom()">
                            <i class="fa-solid fa-plus"></i> <span x-text="t('mpCreateRoom')"></span>
                        </button>
                        <span style="color: var(--pico-muted-color);" x-text="t('mpOr')"></span>
                        <input x-model="mpJoinCode" :placeholder="t('mpRoomCode')" maxlength="6" style="margin: 0; width: 110px; text-transform: uppercase;">
                        <button class="outline" @click="joinRoom()">
                            <i class="fa-solid fa-right-to-bracket"></i> <span x-text="t('mpJoinRoom')"></span>
                        </button>
                    </div>
                </article>
            </div>

            <!-- Lobby -->
            <div x-show="mpScreen === 'lobby'" x-transition>
                <article>
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <small style="color: var(--pico-muted-color);" x-text="t('mpRoomName')"></small>
                            <div style="font-size: 2rem; font-weight: 800; color: var(--pico-primary);" x-text="mpRoomName"></div>
                            <div style="font-weight: 700; letter-spacing: 0.2em; color: var(--pico-color);" x-text="mpCode"></div>
                        </div>
                        <div style="text-align: right;">
                            <small style="color: var(--pico-muted-color);" x-text="t('mpYouAre')"></small>
                            <div style="font-weight: 700;" x-text="mpIsHost ? t('mpHost') : t('mpPlayer')"></div>
                        </div>
                    </div>

                    <!-- Host: QR code -->
                    <template x-if="mpIsHost && mpQr">
                        <div style="text-align: center; margin: 1rem 0;">
                            <small style="color: var(--pico-muted-color);" x-text="t('mpQrHint')"></small>
                            <div style="margin-top: 0.5rem; background: #fff; padding: 0.5rem; border-radius: var(--pico-border-radius); display: inline-block; line-height: 0;">
                                <img :src="mpQr" width="200" height="200" :alt="t('mpQrHint')">
                            </div>
                        </div>
                    </template>

                    <!-- Host: upload pack -->
                    <div x-show="mpIsHost" style="margin-bottom: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem;">
                            <input type="checkbox" x-model="mpHostPlays" @change="mpSetHostPlays()" style="margin: 0;">
                            <span x-text="t('mpHostPlays')"></span>
                        </label>
                        <template x-if="!mpQuestionCount">
                            <div>
                                <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                                    <button class="outline" @click="mpUploadMode = 'file'">
                                        <i class="fa-solid fa-file-arrow-up"></i> <span x-text="t('mpUploadPack')"></span>
                                    </button>
                                    <button class="outline" @click="mpUploadMode = 'paste'">
                                        <i class="fa-solid fa-clipboard"></i> <span x-text="t('mpPastePack')"></span>
                                    </button>
                                </div>
                                <div x-show="mpUploadMode === 'file'" style="margin-top: 0.75rem;">
                                    <input type="file" @change="mpUploadFile($event)" accept=".md" style="margin: 0;">
                                </div>
                                <div x-show="mpUploadMode === 'paste'" style="margin-top: 0.75rem;">
                                    <textarea x-model="mpPasteText" :placeholder="t('mpPastePlaceholder')" rows="6" style="margin-bottom: 0.5rem;"></textarea>
                                    <button class="btn-sm" @click="mpSendPaste()">
                                        <i class="fa-solid fa-check"></i> <span x-text="t('save')"></span>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <div x-show="mpQuestionCount" style="background: var(--pico-card-background-color); padding: 0.75rem 1rem; border-radius: var(--pico-border-radius);">
                            <span x-text="t('mpPackReady', { name: mpPackName, count: mpQuestionCount })"></span>
                        </div>
                    </div>

                    <!-- Players -->
                    <h5 style="margin-bottom: 0.5rem;" x-text="t('mpPlayers') + ' (' + mpPlayers.length + ')'"></h5>
                    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
                        <template x-for="(p, i) in mpPlayers" :key="i">
                            <span class="mp-player-chip" :class="p.isHost ? 'host' : ''">
                                <i class="fa-solid" :class="p.isHost ? 'fa-crown' : 'fa-user'"></i>
                                <span x-text="p.nickname"></span>
                                <small x-text="p.score"></small>
                            </span>
                        </template>
                    </div>

                    <!-- Host: start -->
                    <div x-show="mpIsHost">
                        <template x-if="mpQuestionCount">
                            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                                <label style="margin: 0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap;">
                                    <small style="color: var(--pico-muted-color);" x-text="t('questionsCount')"></small>
                                    <select x-model.number="mpStartCount" style="width: auto; margin: 0;">
                                        <option :value="5">5</option>
                                        <option :value="10" selected>10</option>
                                        <option :value="20">20</option>
                                        <option :value="50">50</option>
                                    </select>
                                </label>
                                <label style="margin: 0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap;">
                                    <small style="color: var(--pico-muted-color);" x-text="t('timePerQuestion')"></small>
                                    <select x-model.number="mpTimePerQuestion" style="width: auto; margin: 0;">
                                        <option :value="10">10s</option>
                                        <option :value="15" selected>15s</option>
                                        <option :value="20">20s</option>
                                        <option :value="30">30s</option>
                                    </select>
                                </label>
                                <button class="btn-auto" @click="mpStartGame()" :disabled="mpPlayers.length < (mpHostPlays ? 2 : 1)">
                                    <i class="fa-solid fa-play"></i> <span x-text="t('mpStartGame')"></span>
                                </button>
                            </div>
                        </template>
                        <p x-show="!mpQuestionCount" style="color: var(--pico-muted-color); margin: 0;" x-text="t('mpUploadHint')"></p>
                    </div>
                    <p x-show="!mpIsHost" style="color: var(--pico-muted-color); margin: 0;" x-text="t('mpWaitingHost')"></p>
                </article>
            </div>

            <!-- Game (question) -->
            <div x-show="mpScreen === 'game'" x-transition>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <span class="category-badge" x-text="mpCurrentQuestion?.category || ''"></span>
                    <small x-text="t('questionOf', { n: mpIndex + 1, total: mpTotal })"></small>
                </div>
                <div style="text-align: center; margin-bottom: 0.25rem;">
                    <small style="color: var(--pico-muted-color);" x-text="mpRoomName + ' · ' + mpCode"></small>
                </div>
                <progress :value="mpIndex + 1" :max="mpTotal"></progress>

                <div class="timer-bar">
                    <div class="timer-fill" :class="mpTimeLeft <= 5 ? 'timer-critical' : mpTimeLeft <= 10 ? 'timer-warning' : ''" :style="`width: ${(mpTimeLeft / mpTimePerQuestion) * 100}%`"></div>
                </div>
                <div style="text-align: right; margin-top: 0.25rem;">
                    <small :style="mpTimeLeft <= 5 ? 'color: #ef4444; font-weight: bold;' : 'color: var(--pico-muted-color);'" x-text="mpTimeLeft + t('seconds')"></small>
                </div>

                <article style="padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.35rem;" x-html="mpCurrentQuestion?.question"></h3>

                    <template x-if="mpCurrentQuestion?.imageUrl">
                        <div class="img-container">
                            <img :src="mpCurrentQuestion.imageUrl" :alt="mpCurrentQuestion.question" @error="handleImageError($event)">
                        </div>
                    </template>

                    <div style="margin-top: 1.25rem;">
                        <template x-for="(opt, oIdx) in mpCurrentQuestion?.options" :key="oIdx">
                            <button class="option-button"
                                    :class="mpOptionState(oIdx).cls"
                                    @click="mpAnswer(oIdx)"
                                    :disabled="mpAnswered || (mpIsHost && !mpHostPlays)">
                                <div>
                                    <strong style="margin-right: 0.5rem;" x-text="['A)', 'B)', 'C)', 'D)', 'E)'][oIdx]"></strong>
                                    <span x-html="opt"></span>
                                </div>
                                <i class="fa-solid" :class="mpOptionState(oIdx).icon"></i>
                            </button>
                        </template>
                    </div>

                    <div x-show="mpAnswered" style="margin-top: 1.25rem; text-align: center;">
                        <small style="color: var(--pico-muted-color);" x-text="t('mpWaitingOthers')"></small>
                    </div>
                </article>
            </div>

            <!-- Results -->
            <div x-show="mpScreen === 'results'" x-transition style="max-width: 600px; margin: 0 auto;">
                <article style="padding: 2rem; text-align: center;">
                    <div style="font-size: 3rem; color: var(--pico-primary); margin-bottom: 1rem;">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 x-text="t('mpGameOver')"></h2>
                    <div style="margin-top: 1.5rem;">
                        <template x-for="(p, i) in mpResults" :key="i">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: var(--pico-border-radius); background: var(--pico-card-background-color);">
                                <span>
                                    <strong x-text="'#' + (i + 1)"></strong>
                                    <i class="fa-solid" :class="p.isHost ? 'fa-crown' : 'fa-user'"></i>
                                    <span x-text="p.nickname"></span>
                                </span>
                                <span>
                                    <i class="fa-solid fa-circle-check" style="color: #10b981;"></i>
                                    <strong x-text="p.score"></strong>
                                </span>
                            </div>
                        </template>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                        <button class="outline" @click="showDashboard()" x-text="t('backToMenu')"></button>
                        <button @click="mpRematch()" x-text="t('mpRematch')"></button>
                    </div>
                </article>

                <div x-show="mpReview.length" style="margin-top: 2rem; text-align: left;">
                    <h4 x-text="t('mpAnswersReview')"></h4>
                    <template x-for="(item, qi) in mpReview" :key="qi">
                        <details class="review-question">
                            <summary>
                                <strong x-text="'#' + (qi + 1)"></strong>
                                <span x-html="item.question"></span>
                                <small style="display: block; color: var(--pico-muted-color);">
                                    <i class="fa-solid fa-circle-check" style="color: #10b981;"></i>
                                    <span x-text="mpReviewSummary(item).correct"></span>
                                    <span x-text="' · '"></span>
                                    <i class="fa-solid fa-circle-xmark" style="color: #ef4444;"></i>
                                    <span x-text="mpReviewSummary(item).wrong"></span>
                                    <template x-if="mpReviewSummary(item).none">
                                        <span x-text="' · — ' + mpReviewSummary(item).none"></span>
                                    </template>
                                </span>
                            </summary>
                            <div style="margin-top: 0.75rem;">
                                <p style="font-weight: 600;" x-html="item.question"></p>
                                <template x-if="item.imageUrl">
                                    <div class="img-container">
                                        <img :src="item.imageUrl" :alt="item.question" @error="handleImageError($event)" style="max-height: 300px;">
                                    </div>
                                </template>
                                <div style="margin-top: 0.5rem;">
                                    <template x-for="(opt, oIdx) in item.options" :key="oIdx">
                                        <div class="option-button"
                                             :class="oIdx === item.correctIndex ? 'correct' : ''"
                                             style="margin-bottom: 0.4rem;">
                                            <div>
                                                <strong style="margin-right: 0.5rem;" x-text="['A)', 'B)', 'C)', 'D)', 'E)'][oIdx]"></strong>
                                                <span x-html="opt"></span>
                                            </div>
                                            <i class="fa-solid" :class="oIdx === item.correctIndex ? 'fa-check' : ''"></i>
                                        </div>
                                    </template>
                                </div>
                                <template x-if="item.explanation">
                                    <div style="margin-top: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--pico-border-radius); background-color: rgba(0, 0, 0, 0.1); border-left: 4px solid var(--pico-primary);">
                                        <div style="font-weight: bold; color: var(--pico-primary); margin-bottom: 0.25rem;">
                                            <i class="fa-solid fa-lightbulb"></i> <span x-text="t('explanation') + ':'"></span>
                                        </div>
                                        <div style="font-size: 0.95rem; color: var(--pico-color);" x-html="item.explanation"></div>
                                    </div>
                                </template>
                            </div>
                        </details>
                    </template>
                </div>
            </div>
        </main>

        <!-- VIEW 4: HISTORY AND STATS -->
        <main x-show="view === 'history'" x-transition>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 x-text="t('historyTitle')"></h3>
                <button class="outline secondary btn-auto" @click="showDashboard()">
                    <i class="fa-solid fa-xmark"></i> <span x-text="t('close')"></span>
                </button>
            </div>

            <article>
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <strong x-text="t('player') + ':'"></strong> <span x-text="username || t('guest')"></span><br>
                        <strong x-text="t('solvedQuestions') + ':'"></strong> <span x-text="getAnsweredCount()"></span>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="outline btn-auto btn-sm" @click="exportSave()">
                            <i class="fa-solid fa-download"></i> <span x-text="t('downloadJSON')"></span>
                        </button>
                        <label class="outline btn-auto btn-sm" style="margin: 0; cursor: pointer;">
                            <i class="fa-solid fa-upload"></i> <span x-text="t('restoreSave')"></span>
                            <input type="file" @change="importSave($event)" accept=".json" style="display: none;">
                        </label>
                        <button class="outline secondary btn-auto btn-sm" @click="resetHistory()">
                            <i class="fa-solid fa-trash-can"></i> <span x-text="t('clearHistory')"></span>
                        </button>
                    </div>
                </div>

                <div style="max-height: 400px; overflow-y: auto;">
                    <template x-for="(item, qId) in history" :key="qId">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--pico-border-color);">
                            <div>
                                <small style="font-family: monospace;" x-text="qId"></small>
                                <div style="font-size: 0.85rem; color: var(--pico-muted-color);" x-text="t('lastAnswer') + ': ' + item.lastAnsweredAt"></div>
                            </div>
                            <div>
                                <span :style="item.correct ? 'color: #10b981;' : 'color: #ef4444;'" style="font-weight: bold;" x-text="item.correct ? t('correct') : t('wrong')"></span>
                            </div>
                        </div>
                    </template>
                    <template x-if="getAnsweredCount() === 0">
                        <p style="text-align: center; color: var(--pico-muted-color); margin: 2rem 0;" x-text="t('noHistory')"></p>
                    </template>
                </div>
            </article>
        </main>

        <!-- VIEW 5: HELP -->
        <main x-show="view === 'help'" x-transition>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 x-text="t('helpTitle')"></h3>
                <button class="outline secondary btn-auto" @click="showDashboard()">
                    <i class="fa-solid fa-xmark"></i> <span x-text="t('close')"></span>
                </button>
            </div>
            <article class="help-section" x-html="helpContent"></article>
        </main>

    </div>

    <!-- Toast -->
    <output class="toast" aria-live="polite" x-show="toast.visible" x-transition>
        <span x-text="toast.message"></span>
    </output>

    <!-- Modal -->
    <dialog x-effect="$el.open = modal.visible" @cancel.prevent="modal.resolve(null); modal.visible = false">
        <article>
            <header>
                <button aria-label="Close" rel="prev" @click="modal.resolve(null); modal.visible = false"></button>
                <p><strong x-text="modal.title"></strong></p>
            </header>
            <textarea x-show="modal.kind === 'markdown'" x-model="modal.inputValue" :placeholder="modal.placeholder" rows="10" style="margin-bottom: 0.5rem;"></textarea>
            <p x-show="modal.kind === 'confirm'" x-text="modal.message"></p>
            <footer>
                <button class="secondary" @click="modal.resolve(null); modal.visible = false" x-text="modal.cancelLabel || t('cancel')"></button>
                <button @click="modal.resolve(modal.kind === 'confirm' ? true : modal.inputValue); modal.visible = false" x-text="modal.confirmLabel || 'OK'"></button>
            </footer>
        </article>
    </dialog>

</body>
</html>
